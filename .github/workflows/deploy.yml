name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Render slides
        run: |
          quarto render slides/intro-to-slideai/index.qmd

      - name: Create deployment directory
        run: |
          mkdir -p _site
          
          # Copy landing page
          cp index.html _site/index.html
          
          # Copy rendered slides
          if [ -f slides/intro-to-slideai/index.html ]; then
            mkdir -p _site/intro-to-slideai
            cp slides/intro-to-slideai/index.html _site/intro-to-slideai/
            cp slides/intro-to-slideai/styles.css _site/intro-to-slideai/
            if [ -d slides/intro-to-slideai/images ]; then
              cp -r slides/intro-to-slideai/images _site/intro-to-slideai/
            fi
            if [ -d slides/intro-to-slideai/index_files ]; then
              cp -r slides/intro-to-slideai/index_files _site/intro-to-slideai/
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
